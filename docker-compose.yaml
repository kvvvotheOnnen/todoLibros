version: '3.8'

services:
  antartica:
    build: ./Antartica
    restart: unless-stopped
    volumes:
      - ./rabbitmq_handler.py:/app/rabbitmq_handler.py
      - ./Antartica/data:/app/data
      - ./Antartica/logs:/app/logs
      - ./logic:/app/logic
      - ./class_products:/app/class_products
      - ./class_scrap_models:/app/class_scrap_models
      - ./class_strategies:/app/class_strategies
      - ./config.py:/app/config.py
    environment:
      - PYTHONPATH=/app
      - LOG_DIR=/app/logs
      - LOG_FILENAME=Antartica.log
    networks:
      - scraping_net
  

  feriachilena:
    build: ./feriaChilena
    restart: unless-stopped
    volumes:
      - ./rabbitmq_handler.py:/app/rabbitmq_handler.py
      - ./feriaChilena/data:/app/data
      - ./feriaChilena/logs:/app/logs
      - ./logic:/app/logic
      - ./class_products:/app/class_products
      - ./class_scrap_models:/app/class_scrap_models
      - ./class_strategies:/app/class_strategies
      - ./config.py:/app/config.py
    environment:
      - PYTHONPATH=/app
      - LOG_DIR=/app/logs
      - LOG_FILENAME=feriaChilena.log
  
    networks:
      - scraping_net
  
  miralibros:
    build: ./miraLibros
    restart: unless-stopped
    volumes:
      - ./rabbitmq_handler.py:/app/rabbitmq_handler.py
      - ./miraLibros/data:/app/data
      - ./miraLibros/logs:/app/logs
      - ./logic:/app/logic
      - ./class_products:/app/class_products
      - ./class_scrap_models:/app/class_scrap_models
      - ./class_strategies:/app/class_strategies
      - ./config.py:/app/config.py
    environment:
      - PYTHONPATH=/app
      - LOG_DIR=/app/logs
      - LOG_FILENAME=Miralibros.log
    networks:
      - scraping_net


networks:
  scraping_net:
    driver: bridge