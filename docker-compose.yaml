version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.12.4-management  
    hostname: rabbitmq
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER} 
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}  
      - RABBITMQ_DEFAULT_VHOST=/
      - RABBITMQ_LOGS=- 
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - scraping_net
    restart: unless-stopped


  antartica:
    build: ./Antartica
    restart: unless-stopped
    volumes:
      - ./rabbitmq_handler.py:/app/rabbitmq_handler.py
      - ./Antartica/data:/app/data
      - ./Antartica/logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - LOG_DIR=/app/logs
      - LOG_FILENAME=Antartica.log
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=${RABBITMQ_AMQP_PORT}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
    depends_on:
      - rabbitmq
    networks:
      - scraping_net
  
  buscalibre:
    build: ./Buscalibre
    restart: unless-stopped
    volumes:
      - ./rabbitmq_handler.py:/app/rabbitmq_handler.py
      - ./Buscalibre/data:/app/data
      - ./Buscalibre/logs:/app/logs
    environment:
      - LOG_DIR=/app/logs
      - LOG_FILENAME=Buscalibre.log
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=${RABBITMQ_AMQP_PORT}
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
    depends_on:
      - rabbitmq
    networks:
      - scraping_net
